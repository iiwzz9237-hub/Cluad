<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MyCode AI</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

:root {
    --bg: #090d18;
    --panel: #111827;
    --panel2: #192335;
    --border: #293449;
    --text: #edf2fa;
    --muted: #94a3b8;
    --accent: #7357ff;
    --green: #22c55e;
}

body {
    background: var(--bg);
    color: var(--text);
    font-family: Tahoma, Arial, sans-serif;
    height: 100dvh;
    overflow: hidden;
}

button, textarea, select {
    font-family: inherit;
}

button {
    cursor: pointer;
}

button:disabled {
    opacity: .45;
    cursor: not-allowed;
}

.app {
    height: 100dvh;
    display: flex;
    flex-direction: column;
}

/* HEADER */

header {
    padding: 14px 20px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
}

.brand {
    display: flex;
    align-items: center;
    gap: 12px;
}

.logo {
    width: 45px;
    height: 45px;
    background: linear-gradient(135deg,#7357ff,#3b82f6);
    border-radius: 13px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    font-size: 21px;
    direction: ltr;
}

.brand h2 {
    font-size: 18px;
}

.brand p {
    font-size: 11px;
    color: var(--muted);
    margin-top: 5px;
}

.status {
    font-size: 12px;
    color: var(--muted);
}

.online {
    color: var(--green);
}

/* MODEL BAR */

.model-bar {
    background: #0e1626;
    border-bottom: 1px solid var(--border);
    padding: 12px 18px;
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
}

select {
    background: var(--panel2);
    color: white;
    border: 1px solid var(--border);
    padding: 11px;
    border-radius: 9px;
    flex: 1;
    min-width: 180px;
}

.btn {
    padding: 11px 15px;
    border: 1px solid var(--border);
    border-radius: 9px;
    background: var(--panel2);
    color: white;
    font-size: 12px;
}

.btn.primary {
    background: var(--accent);
    border-color: var(--accent);
}

.progress {
    height: 4px;
    background: #253047;
}

.progress-fill {
    background: var(--accent);
    width: 0%;
    height: 100%;
    transition: width .2s;
}

/* WORKSPACE */

.workspace {
    flex: 1;
    min-height: 0;
    display: grid;
    grid-template-columns: 42% 58%;
}

/* CHAT */

.chat-panel {
    display: flex;
    flex-direction: column;
    min-height: 0;
    border-left: 1px solid var(--border);
}

.panel-header {
    padding: 14px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
}

.panel-header h3 {
    font-size: 14px;
}

.messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
}

.welcome {
    text-align: center;
    padding: 35px 10px;
}

.welcome-icon {
    width: 70px;
    height: 70px;
    background: linear-gradient(135deg,#7357ff,#2563eb);
    border-radius: 20px;
    display: grid;
    place-items: center;
    margin: auto;
    font-size: 30px;
}

.welcome h2 {
    margin-top: 20px;
    font-size: 21px;
}

.welcome p {
    color: var(--muted);
    line-height: 2;
    margin-top: 13px;
    font-size: 13px;
}

.suggestions {
    margin-top: 25px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 9px;
}

.suggestions button {
    background: var(--panel2);
    color: white;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 13px 8px;
    font-size: 12px;
}

.message {
    margin-bottom: 18px;
}

.role {
    font-size: 11px;
    color: #a59aff;
    margin-bottom: 7px;
}

.message.user .role {
    color: var(--green);
}

.bubble {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 13px;
    padding: 13px;
    font-size: 13px;
    line-height: 1.8;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    unicode-bidi: plaintext;
}

.message.user .bubble {
    background: #1e2950;
}

/* INPUT */

.input-box {
    background: var(--panel);
    border-top: 1px solid var(--border);
    padding: 13px;
}

.input-box textarea {
    width: 100%;
    min-height: 95px;
    max-height: 170px;
    resize: vertical;
    background: var(--panel2);
    color: white;
    border: 1px solid var(--border);
    outline: none;
    border-radius: 12px;
    padding: 12px;
    font-size: 13px;
    line-height: 1.8;
}

.input-actions {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    margin-top: 10px;
}

.input-actions span {
    color: var(--muted);
    font-size: 11px;
    line-height: 1.7;
}

.send {
    background: var(--accent);
    color: white;
    border: none;
    padding: 12px 20px;
    border-radius: 10px;
}

/* CODE PANEL */

.code-panel {
    display: flex;
    flex-direction: column;
    min-height: 0;
    background: #0b1020;
}

.code-toolbar {
    padding: 12px;
    background: var(--panel);
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    border-bottom: 1px solid var(--border);
}

.code-toolbar span {
    font-size: 12px;
    color: var(--muted);
    margin-left: auto;
}

.editor {
    flex: 1;
    min-height: 120px;
    width: 100%;
    resize: none;
    outline: none;
    background: #0a1020;
    color: #d4e2fa;
    padding: 20px;
    border: none;
    font-family: Consolas, monospace;
    font-size: 13px;
    line-height: 1.8;
    direction: ltr;
    text-align: left;
    tab-size: 4;
}

.preview-header {
    padding: 12px;
    background: var(--panel);
    border-top: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
    font-size: 12px;
}

.preview {
    height: 35%;
    min-height: 140px;
    background: white;
    width: 100%;
    border: none;
}

/* MOBILE */

.mobile-tabs {
    display: none;
}

@media(max-width:800px) {

    header {
        padding: 11px;
    }

    .brand h2 {
        font-size: 15px;
    }

    .brand p {
        font-size: 10px;
    }

    .logo {
        width: 39px;
        height: 39px;
    }

    .workspace {
        display: flex;
        flex-direction: column;
        overflow: hidden;
    }

    .mobile-tabs {
        display: flex;
        background: var(--panel);
        border-bottom: 1px solid var(--border);
    }

    .mobile-tabs button {
        flex: 1;
        background: transparent;
        color: var(--muted);
        border: none;
        padding: 13px;
    }

    .mobile-tabs button.active {
        color: white;
        border-bottom: 2px solid var(--accent);
    }

    .chat-panel,
    .code-panel {
        flex: 1;
        min-height: 0;
    }

    .code-panel {
        display: none;
    }

    .workspace.show-code .chat-panel {
        display: none;
    }

    .workspace.show-code .code-panel {
        display: flex;
    }

    .messages {
        padding: 12px;
    }

    .suggestions {
        grid-template-columns: 1fr 1fr;
    }

    .preview {
        height: 35%;
    }

}

</style>

</head>

<body>

<div class="app">

<header>

    <div class="brand">

        <div class="logo">&lt;/&gt;</div>

        <div>
            <h2>MyCode AI</h2>
            <p>هوش مصنوعی شخصی برنامه‌نویسی</p>
        </div>

    </div>

    <span class="status" id="connectionStatus">
        مدل بارگذاری نشده
    </span>

</header>


<div class="model-bar">

    <select id="modelSelect">

        <option value="coder">
            Qwen2.5 Coder 1.5B
        </option>

        <option value="light">
            SmolLM2 360M - سبک
        </option>

    </select>

    <button class="btn primary" id="loadBtn">
        فعال‌سازی هوش مصنوعی
    </button>

</div>

<div class="progress">
    <div class="progress-fill" id="progressFill"></div>
</div>


<div class="mobile-tabs">

    <button class="active" id="chatTab">
        گفتگو
    </button>

    <button id="codeTab">
        محیط کدنویسی
    </button>

</div>


<div class="workspace" id="workspace">

    <section class="chat-panel">

        <div class="panel-header">

            <h3>گفتگو با هوش مصنوعی</h3>

            <button class="btn" id="clearBtn">
                گفتگوی جدید
            </button>

        </div>


        <div class="messages" id="messages">

            <div class="welcome" id="welcome">

                <div class="welcome-icon">
                    &lt;/&gt;
                </div>

                <h2>سلام، من MyCode AI هستم</h2>

                <p>
                    دستیار شخصی برنامه‌نویسی تو.
                    <br>
                    می‌تونم کد تولید کنم، توضیح بدم
                    و در رفع خطاها کمکت کنم.
                </p>

                <div class="suggestions">

                    <button onclick="suggest('یک بازی مار با HTML CSS JavaScript بساز')">
                        ساخت بازی مار
                    </button>

                    <button onclick="suggest('یک ماشین حساب زیبا با HTML CSS JavaScript بساز')">
                        ساخت ماشین حساب
                    </button>

                    <button onclick="suggest('یک سایت فروشگاهی ساده و واکنش‌گرا با HTML بساز')">
                        ساخت فروشگاه
                    </button>

                    <button onclick="suggest('یک برنامه ماشین حساب با Python بنویس')">
                        برنامه Python
                    </button>

                </div>

            </div>

        </div>


        <div class="input-box">

            <textarea
                id="prompt"
                placeholder="مثلاً: یک بازی دوز با HTML بساز که بتوانم با کامپیوتر بازی کنم..."
            ></textarea>

            <div class="input-actions">

                <span id="aiStatus">
                    ابتدا مدل را فعال کن.
                </span>

                <button class="send" id="sendBtn">
                    ارسال ↑
                </button>

            </div>

        </div>

    </section>


    <section class="code-panel">

        <div class="code-toolbar">

            <span id="codeTitle">
                Code Editor
            </span>

            <button class="btn" id="copyBtn">
                کپی
            </button>

            <button class="btn" id="downloadBtn">
                دانلود
            </button>

            <button class="btn primary" id="runBtn">
                اجرای HTML
            </button>

        </div>


        <textarea
            class="editor"
            id="codeEditor"
            spellcheck="false"
            placeholder="// کدهای تولیدشده اینجا نمایش داده می‌شوند..."
        ></textarea>


        <div class="preview-header">
            پیش‌نمایش HTML
        </div>

        <iframe
            id="preview"
            class="preview"
            sandbox="allow-scripts"
            title="HTML Preview"
        ></iframe>

    </section>

</div>

</div>


<script type="module">

import * as webllm from
"https://esm.run/@mlc-ai/web-llm@0.2.85";


/* ==============================
   ELEMENTS
============================== */

const $ = id => document.getElementById(id);

const messages = $("messages");

const promptInput = $("prompt");

const codeEditor = $("codeEditor");

const sendBtn = $("sendBtn");

const loadBtn = $("loadBtn");

const modelSelect = $("modelSelect");

const preview = $("preview");

const aiStatus = $("aiStatus");

const connectionStatus = $("connectionStatus");

const progressFill = $("progressFill");


/* ==============================
   LOCAL AI MODELS
============================== */

const CODER_MODEL =
"qwen2.5-coder-1.5b-instruct-q4f16";

const LIGHT_MODEL =
"SmolLM2-360M-Instruct-q4f16_1-MLC";


const coderConfig = {

    model_list: [

        {

            model:
"https://huggingface.co/skillsafe-ai/qwen2.5-coder-1.5b-instruct-q4f16",

            model_id: CODER_MODEL,

            model_lib:
"https://huggingface.co/skillsafe-ai/qwen2.5-coder-1.5b-instruct-q4f16/resolve/main/lib/Qwen2-1.5B-Instruct-q4f16_1-ctx4k_cs1k-webgpu.wasm",

            overrides: {

                context_window_size: 4096,

                prefill_chunk_size: 1024

            }

        },

        ...webllm.prebuiltAppConfig.model_list

    ],

    cacheBackend: "cache"

};


/* ==============================
   AI STATE
============================== */

let engine = null;

let currentModel = null;

let loading = false;

let generating = false;

let currentLanguage = "html";

let history = [];


/* ==============================
   SYSTEM PROMPT
============================== */

const SYSTEM_PROMPT = `
You are MyCode AI, a personal coding assistant.

Your main purpose is writing working computer code.

You are specialized in:

HTML
CSS
JavaScript
Python
C++
PHP
SQL

Rules:

1. Understand the user's programming request.

2. Produce real, functional code.

3. Avoid pseudocode when actual code is requested.

4. For HTML projects, generate a complete standalone
HTML document including CSS and JavaScript.

5. Put code inside markdown code fences with
the correct language name.

6. Keep explanations concise.

7. If the user requests a modification,
modify the previous implementation.

8. If a bug is reported, identify the likely cause
and provide corrected code.

9. Respond in Persian when the user speaks Persian.

10. Never falsely claim that code was tested.

11. Prefer simple implementations
without unnecessary external dependencies.

You are a local AI assistant running in the browser.
`;


/* ==============================
   STORAGE
============================== */

function saveState() {

    try {

        localStorage.setItem(
            "mycode_history",
            JSON.stringify(history.slice(-20))
        );

        localStorage.setItem(
            "mycode_editor",
            codeEditor.value
        );

        localStorage.setItem(
            "mycode_language",
            currentLanguage
        );

    } catch (error) {

        console.warn("Local storage unavailable", error);

    }

}


function restoreState() {

    try {

        const savedHistory =
            localStorage.getItem("mycode_history");

        const savedCode =
            localStorage.getItem("mycode_editor");

        const savedLanguage =
            localStorage.getItem("mycode_language");


        if (savedHistory) {

            const parsed = JSON.parse(savedHistory);

            if (Array.isArray(parsed)) {

                history = parsed.filter(item =>

                    item &&
                    ["user", "assistant"].includes(item.role) &&
                    typeof item.content === "string"

                ).slice(-20);

                if (history.length) {

                    $("welcome").style.display = "none";

                    history.forEach(item => {

                        addMessage(
                            item.role,
                            item.content
                        );

                    });

                }

            }

        }


        if (savedCode) {

            codeEditor.value = savedCode;

        }


        if (savedLanguage) {

            currentLanguage = savedLanguage;

        }

    } catch (error) {

        console.warn("Could not restore data", error);

    }

}


/* ==============================
   UI HELPERS
============================== */

function setStatus(text) {

    aiStatus.textContent = text;

}


function scrollBottom() {

    messages.scrollTop = messages.scrollHeight;

}


function addMessage(role, content) {

    const box = document.createElement("div");

    box.className = "message " + role;


    const title = document.createElement("div");

    title.className = "role";

    title.textContent =
        role === "user" ? "شما" : "MyCode AI";


    const bubble = document.createElement("div");

    bubble.className = "bubble";

    bubble.textContent = content;


    box.appendChild(title);

    box.appendChild(bubble);

    messages.appendChild(box);

    scrollBottom();

    return bubble;

}


/* ==============================
   LOAD LOCAL MODEL
============================== */

async function loadModel() {

    if (loading || generating) {
        return;
    }


    if (!navigator.gpu) {

        setStatus(
            "مرورگر یا دستگاهت از WebGPU پشتیبانی نمی‌کند."
        );

        connectionStatus.textContent =
            "WebGPU unavailable";

        return;

    }


    const adapter = await navigator.gpu.requestAdapter();

    if (!adapter) {

        setStatus(
            "پردازنده گرافیکی سازگار پیدا نشد."
        );

        return;

    }


    loading = true;

    loadBtn.disabled = true;

    sendBtn.disabled = true;

    modelSelect.disabled = true;


    const selected =
        modelSelect.value === "coder"
        ? CODER_MODEL
        : LIGHT_MODEL;


    setStatus("در حال بارگذاری مغز هوش مصنوعی...");


    try {

        if (engine && engine.unload) {

            await engine.unload();

        }

        engine = null;
        currentModel = null;


        engine = await webllm.CreateMLCEngine(

            selected,

            {

                appConfig: coderConfig,

                initProgressCallback: report => {

                    const percent = Math.round(
                        (report.progress || 0) * 100
                    );

                    progressFill.style.width =
                        percent + "%";


                    setStatus(
                        "بارگذاری مدل: " +
                        percent + "%"
                    );

                }

            }

        );


        currentModel = selected;

        progressFill.style.width = "100%";

        connectionStatus.textContent =
            "● AI Ready";

        connectionStatus.classList.add("online");

        setStatus(
            "هوش مصنوعی آماده کدنویسی است."
        );

        loadBtn.textContent =
            "مدل فعال شد";

    }

    catch (error) {

        console.error(error);

        engine = null;
        currentModel = null;

        connectionStatus.textContent =
            "مدل فعال نشد";

        connectionStatus.classList.remove("online");

        setStatus(
            "خطا در بارگذاری مدل: " +
            error.message
        );

        loadBtn.textContent =
            "تلاش مجدد";

    }

    finally {

        loading = false;

        loadBtn.disabled = false;

        sendBtn.disabled = false;

        modelSelect.disabled = false;

    }

}


/* ==============================
   EXTRACT CODE
============================== */

function extractCode(text) {

    const regex =
        /```([a-zA-Z0-9+#.-]*)[^\n]*\n([\s\S]*?)```/g;

    const blocks = [...text.matchAll(regex)];

    if (blocks.length > 0) {

        let selected = blocks[0];

        const htmlBlock = blocks.find(
            block => block[1].toLowerCase() === "html"
        );

        if (htmlBlock) {
            selected = htmlBlock;
        }


        currentLanguage =
            selected[1].toLowerCase() || "txt";

        codeEditor.value =
            selected[2].trim();

        saveState();

        return true;

    }


    const trimmed = text.trim();

    if (
        trimmed.startsWith("<!DOCTYPE html") ||
        trimmed.startsWith("<html") ||
        trimmed.startsWith("<!doctype html")
    ) {

        codeEditor.value = trimmed;

        currentLanguage = "html";

        saveState();

        return true;

    }

    return false;

}


/* ==============================
   AI GENERATION
============================== */

async function sendMessage() {

    if (generating || loading) {
        return;
    }


    if (!engine || currentModel === null) {

        setStatus(
            "ابتدا روی فعال‌سازی هوش مصنوعی بزن."
        );

        return;

    }


    const text = promptInput.value.trim();

    if (!text) {
        return;
    }


    generating = true;

    sendBtn.disabled = true;

    loadBtn.disabled = true;

    modelSelect.disabled = true;


    $("welcome").style.display = "none";

    addMessage("user", text);

    promptInput.value = "";


    history.push({

        role: "user",

        content: text

    });


    setStatus(
        "هوش مصنوعی در حال تولید کد است..."
    );


    const outputBubble =
        addMessage("assistant", "");


    let output = "";


    try {

        const contextMessages =
            history.slice(-5);


        const stream =
            await engine.chat.completions.create({

                messages: [

                    {
                        role: "system",
                        content: SYSTEM_PROMPT
                    },

                    ...contextMessages

                ],

                temperature: 0.3,

                top_p: 0.9,

                max_tokens: 1800,

                stream: true

            });


        for await (const chunk of stream) {

            const token =
                chunk.choices?.[0]?.delta?.content || "";


            output += token;

            outputBubble.textContent = output;

            scrollBottom();

        }


        if (!output.trim()) {

            throw new Error(
                "مدل پاسخ متنی تولید نکرد."
            );

        }


        history.push({

            role: "assistant",

            content: output

        });


        const hasCode =
            extractCode(output);


        if (hasCode) {

            setStatus(
                "کد تولید شد و داخل ویرایشگر قرار گرفت."
            );

        }

        else {

            setStatus(
                "پاسخ هوش مصنوعی دریافت شد."
            );

        }


        saveState();

    }

    catch (error) {

        console.error(error);

        outputBubble.textContent =
            "خطا در تولید پاسخ:\n" +
            error.message;


        history.pop();

        setStatus(
            "تولید پاسخ ناموفق بود."
        );

        saveState();

    }

    finally {

        generating = false;

        sendBtn.disabled = false;

        loadBtn.disabled = false;

        modelSelect.disabled = false;

    }

}


/* ==============================
   SUGGESTIONS
============================== */

window.suggest = function(text) {

    promptInput.value = text;

    promptInput.focus();

};


/* ==============================
   CODE PREVIEW
============================== */

function runCode() {

    const code = codeEditor.value.trim();

    if (!code) {

        setStatus("ابتدا یک کد وارد کن.");

        return;

    }


    if (
        currentLanguage !== "html" &&
        currentLanguage !== "htm"
    ) {

        setStatus(
            "پیش‌نمایش فقط برای کد HTML فعال است."
        );

        return;

    }


    preview.srcdoc = code;

    setStatus(
        "پیش‌نمایش HTML اجرا شد."
    );

}


/* ==============================
   DOWNLOAD CODE
============================== */

function downloadCode() {

    const code = codeEditor.value;

    if (!code.trim()) {

        setStatus(
            "کدی برای دانلود وجود ندارد."
        );

        return;

    }


    const extensions = {

        html: "html",
        htm: "html",
        javascript: "js",
        js: "js",
        python: "py",
        py: "py",
        cpp: "cpp",
        "c++": "cpp",
        css: "css",
        php: "php",
        sql: "sql",
        json: "json"

    };


    const extension =
        extensions[currentLanguage] || "txt";


    const fileName =
        "mycode-project." + extension;


    const blob = new Blob(

        [code],

        {
            type: "text/plain;charset=utf-8"
        }

    );


    const url = URL.createObjectURL(blob);

    const link = document.createElement("a");

    link.href = url;

    link.download = fileName;

    document.body.appendChild(link);

    link.click();

    link.remove();


    setTimeout(() => {

        URL.revokeObjectURL(url);

    }, 1000);


    setStatus(
        "فایل کد آماده دانلود شد."
    );

}


/* ==============================
   COPY CODE
============================== */

async function copyCode() {

    if (!codeEditor.value.trim()) {
        return;
    }

    try {

        await navigator.clipboard.writeText(
            codeEditor.value
        );

        setStatus("کد کپی شد.");

    } catch {

        setStatus("کپی کد ناموفق بود.");

    }

}


/* ==============================
   NEW CHAT
============================== */

function clearChat() {

    if (generating || loading) {
        return;
    }


    history = [];

    messages.innerHTML = "";

    codeEditor.value = "";

    preview.srcdoc = "";

    currentLanguage = "html";


    const welcome = document.createElement("div");

    welcome.className = "welcome";

    welcome.textContent =
        "گفتگوی جدید آماده است. درخواست برنامه‌نویسی خودت را بنویس.";

    messages.appendChild(welcome);


    saveState();

    setStatus(
        engine
        ? "گفتگوی جدید آماده است."
        : "ابتدا مدل را فعال کن."
    );

}


/* ==============================
   MOBILE TABS
============================== */

function showTab(tab) {

    const workspace = $("workspace");

    const chatTab = $("chatTab");

    const codeTab = $("codeTab");


    if (tab === "code") {

        workspace.classList.add("show-code");

        codeTab.classList.add("active");

        chatTab.classList.remove("active");

    }

    else {

        workspace.classList.remove("show-code");

        chatTab.classList.add("active");

        codeTab.classList.remove("active");

    }

}


/* ==============================
   EVENTS
============================== */

loadBtn.addEventListener(
    "click",
    loadModel
);

sendBtn.addEventListener(
    "click",
    sendMessage
);

$("runBtn").addEventListener(
    "click",
    runCode
);

$("downloadBtn").addEventListener(
    "click",
    downloadCode
);

$("copyBtn").addEventListener(
    "click",
    copyCode
);

$("clearBtn").addEventListener(
    "click",
    clearChat
);


$("chatTab").addEventListener(
    "click",
    () => showTab("chat")
);

$("codeTab").addEventListener(
    "click",
    () => showTab("code")
);


promptInput.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Enter" &&
            event.ctrlKey
        ) {

            event.preventDefault();

            sendMessage();

        }

    }
);


codeEditor.addEventListener(
    "input",
    saveState
);


modelSelect.addEventListener(
    "change",
    () => {

        if (
            currentModel &&
            currentModel !== (
                modelSelect.value === "coder"
                ? CODER_MODEL
                : LIGHT_MODEL
            )
        ) {

            connectionStatus.textContent =
                "مدل جدید را فعال کن";

            connectionStatus.classList.remove("online");

            setStatus(
                "برای تغییر مدل، دکمه فعال‌سازی را بزن."
            );

        }

    }
);


/* ==============================
   START
============================== */

restoreState();

setStatus(
    "مدل موردنظر را انتخاب و فعال کن."
);

</script>
